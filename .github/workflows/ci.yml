name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax-check:
    name: Python syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: py_compile all Python files
        run: |
          python -m py_compile $(find . -type f -name "*.py" -not -path "./.git/*")

  test:
    name: Pytest smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal test deps
        run: |
          python -m pip install --upgrade pip
          # 무거운 freqtrade/torch는 CI에서 스킵, 핵심 ML 모듈만 테스트
          pip install pytest numpy pandas scikit-learn xgboost
      - name: Run tests
        env:
          TRADING_ROOT: /tmp/trading_ci
        run: |
          mkdir -p /tmp/trading_ci/freqtrade_userdata/{models,logs}
          pytest tests/ -v --tb=short
